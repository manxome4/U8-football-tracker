<!-- PWA Web App Manifest (Inline Blob Strategy) -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#18181b">

<script>
  // Dynamically inject web manifest for Chrome PWA install support
  const manifest = {
    name: "U8 Football Tracker",
    short_name: "U8 Tracker",
    start_url: "./index.html",
    display: "standalone",
    background_color: "#18181b",
    theme_color: "#18181b",
    icons: [{
      src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2318181b'/><circle cx='50' cy='50' r='30' fill='%23dc2626'/><text x='50' y='58' font-size='24' font-weight='bold' text-anchor='middle' fill='white'>U8</text></svg>",
      sizes: "512x512",
      type: "image/svg+xml",
      purpose: "any maskable"
    }]
  };
  const stringManifest = JSON.stringify(manifest);
  const blob = new Blob([stringManifest], {type: 'application/json'});
  const manifestURL = URL.createObjectURL(blob);
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = manifestURL;
  document.head.appendChild(link);
</script>

            const [newNoteText, setNewNoteText] = useState('');

            }, [players]);

            const currentPitchSlots = [
                ...FORMATIONS[formationKey].team1.map(s => ({ ...s, team: 'team1' })),
                ...FORMATIONS[formationKey].team2.map(s => ({ ...s, team: 'team2' }))
            ];

            const ALL_BENCH_SLOTS = Array.from({ length: 16 }, (_, i) => `bench_${i + 1}`);

            const handleFormationChange = (newFormation) => {
                setFormationKey(newFormation);
                const newSlots = [
                    ...FORMATIONS[newFormation].team1.map(s => s.id),
                    ...FORMATIONS[newFormation].team2.map(s => s.id)
                ];

                setPlayers(prev => {
                    const occupiedSlots = new Set();
                    const updated = [...prev];

                    updated.forEach((p) => {
                        if (newSlots.includes(p.slotId) && !occupiedSlots.has(p.slotId)) {
                            occupiedSlots.add(p.slotId);
                        }
                    });

                    const t1OpenSlots = FORMATIONS[newFormation].team1.map(s => s.id).filter(id => !occupiedSlots.has(id));
                    const t2OpenSlots = FORMATIONS[newFormation].team2.map(s => s.id).filter(id => !occupiedSlots.has(id));

                    return updated.map(p => {
                        if (!newSlots.includes(p.slotId) && !p.slotId.startsWith('bench_')) {
                            if (p.slotId.startsWith('t1_') && t1OpenSlots.length > 0) {
                                const nextSlot = t1OpenSlots.shift();
                                occupiedSlots.add(nextSlot);
                                return { ...p, slotId: nextSlot };
                            }
                            if (p.slotId.startsWith('t2_') && t2OpenSlots.length > 0) {
                                const nextSlot = t2OpenSlots.shift();
                                occupiedSlots.add(nextSlot);
                                return { ...p, slotId: nextSlot };
                            }
                            const usedBenchSlots = updated.map(x => x.slotId).filter(s => s.startsWith('bench_'));
                            const freeBenchSlot = ALL_BENCH_SLOTS.find(b => !usedBenchSlots.includes(b)) || 'bench_1';
                            return { ...p, slotId: freeBenchSlot };
                        }
                        return p;
                    });
                });
            };

            const getSlotTeam = (slotId) => {
                if (slotId.startsWith('t1_')) return 'team1';
                if (slotId.startsWith('t2_')) return 'team2';
                return 'bench';
            };

            const getSlotRole = (slotId) => {
                const slot = currentPitchSlots.find(s => s.id === slotId);
                return slot ? slot.role : 'SUB';
            };

            // Touch Tap-to-Place / Tap-to-Swap Logic
            const handleSlotOrPlayerTap = (targetSlotId, playerInSlot) => {
                if (!activeSwapPlayerId) {
                    if (playerInSlot) {
                        setActiveSwapPlayerId(playerInSlot.id);
                    }
                    return;
                }

                if (playerInSlot && playerInSlot.id === activeSwapPlayerId) {
                    // Double tap opens profile modal
                    setSelectedPlayer(playerInSlot);
                    setActiveSwapPlayerId(null);
                    return;
                }

                // Swap or Move
                setPlayers(prev => {
                    const movingPlayer = prev.find(p => p.id === activeSwapPlayerId);
                    if (!movingPlayer) return prev;

                    return prev.map(p => {
                        if (p.id === activeSwapPlayerId) return { ...p, slotId: targetSlotId };
                        if (playerInSlot && p.id === playerInSlot.id) return { ...p, slotId: movingPlayer.slotId };
                        return p;
                    });
                });

                setActiveSwapPlayerId(null);
            };

            const handleUpdatePlayer = (id, field, value) => {
                setPlayers(prev => prev.map(p => {
                    if (p.id === id) return { ...p, [field]: value };
                    return p;
                }));
                if (selectedPlayer && selectedPlayer.id === id) {
                    setSelectedPlayer(prev => ({ ...prev, [field]: value }));
                }
            };

            const handleAddTrayItem = (field, itemToAdd) => {
                if (!itemToAdd || !selectedPlayer) return;
                const currentList = selectedPlayer[field] || [];
                if (!currentList.includes(itemToAdd)) {
                    handleUpdatePlayer(selectedPlayer.id, field, [...currentList, itemToAdd]);
                }
            };

            const handleRemoveTrayItem = (field, itemToRemove) => {
                if (!selectedPlayer) return;
                const currentList = selectedPlayer[field] || [];
                handleUpdatePlayer(selectedPlayer.id, field, currentList.filter(item => item !== itemToRemove));
            };

                e.preventDefault();
                if (!newNoteText.trim() || !selectedPlayer) return;
                const now = new Date();
                const formattedDate = `${now.toLocaleDateString()} ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;

                setNewNoteText('');
            };

            const handleDeleteNote = (noteId) => {
                if (!selectedPlayer) return;
                handleUpdatePlayer(selectedPlayer.id, 'notes', (selectedPlayer.notes || []).filter(n => n.id !== noteId));

                if (!selectedPlayer || !editingNoteText.trim()) return;
                const updatedNotes = (selectedPlayer.notes || []).map(n => n.id === noteId ? { ...n, text: editingNoteText.trim() } : n);

                            alert('Invalid JSON file format.');

                            <span className="text-[10px]">Save / Data</span>
                        </button>
                    </header>

                    {/* View Switcher & Formation Controls */}

                                onClick={() => setActiveTab('pitch')}

                                            <select
                                                value=""
                                                onChange={(e) => {
                                                    const val = e.target.value;
                                                    if (val) handleAddTrayItem('focusAreas', val);
                                                }}
                                                className="w-full bg-zinc-900 border border-zinc-700 rounded-lg text-xs p-2 text-white focus:outline-none focus:border-red-500"
                                            >
                                                <option value="" disabled>-- Add Focus Area --</option>
                                                {FOCUS_AREA_OPTIONS.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                                            </select>

                                            <div className="flex space-x-1.5 pt-0.5">
                                                <input 
                                                    type="text"
                                                    value={customFocus}
                                                    onChange={(e) => setCustomFocus(e.target.value)}
                                                    placeholder="Or type custom focus area..."
                                                    className="flex-1 bg-zinc-900 border border-zinc-800 rounded-lg text-xs p-1.5 text-white focus:outline-none focus:border-red-500"
                                                />
                                                <button 
                                                    onClick={() => {
                                                        if (customFocus.trim()) {
                                                            handleAddTrayItem('focusAreas', customFocus.trim());
                                                            setCustomFocus('');
                                                        }
                                                    }}
                                                    className="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs px-2.5 rounded-lg border border-zinc-700 font-semibold"
                                                >
                                                    Add
                                                </button>
                                            </div>

                                            <div className="flex flex-wrap gap-1.5 pt-1 min-h-[30px]">
                                                {(!selectedPlayer.focusAreas || selectedPlayer.focusAreas.length === 0) ? (
                                                    <span className="text-[11px] text-zinc-600 italic">No focus areas selected</span>
                                                ) : (
                                                    selectedPlayer.focusAreas.map((item, idx) => (
                                                        <span key={idx} className="bg-amber-950/80 border border-amber-600/80 text-amber-200 text-[11px] font-semibold px-2 py-0.5 rounded-full flex items-center space-x-1.5 shadow-sm">
                                                            <span>🎯 {item}</span>
                                                            <button 
                                                                onClick={() => handleRemoveTrayItem('focusAreas', item)}
                                                                className="hover:text-white text-amber-400 font-bold text-xs leading-none"
                                                            >
                                                                ×
                                                            </button>
                                                        </span>
                                                    ))
                                                )}
                                            </div>
                                        </div>
                                    </div>

                                    {/* Position Preferences */}
                                    <div className="bg-zinc-950 rounded-2xl p-3 border border-zinc-800 space-y-3">
                                        <div className="text-xs font-bold text-zinc-300 uppercase tracking-wider flex items-center space-x-1.5">
                                            <svg className="w-3.5 h-3.5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                                            <span>Position Preferences</span>
                                        </div>

                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="text-[11px] text-zinc-400 font-medium block mb-1">Preferred</label>
                                                <select
                                                    value={selectedPlayer.preferredPos || 'General'}
                                                    onChange={(e) => handleUpdatePlayer(selectedPlayer.id, 'preferredPos', e.target.value)}
                                                    className="w-full bg-zinc-900 border border-zinc-700 rounded-lg text-xs p-2 text-white focus:outline-none focus:border-red-500"
                                                >
                                                    {POSITION_CATEGORIES.map(pos => <option key={pos} value={pos}>{pos}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="text-[11px] text-zinc-400 font-medium block mb-1">Coach Suggested</label>
                                                <select
                                                    value={selectedPlayer.suggestedPos || 'General'}
                                                    onChange={(e) => handleUpdatePlayer(selectedPlayer.id, 'suggestedPos', e.target.value)}
                                                    className="w-full bg-zinc-900 border border-zinc-700 rounded-lg text-xs p-2 text-white focus:outline-none focus:border-red-500"
                                                >
                                                    {POSITION_CATEGORIES.map(pos => <option key={pos} value={pos}>{pos}</option>)}
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Session & Match Notes Tray */}
                                    <div className="bg-zinc-950 rounded-2xl p-3 border border-zinc-800 space-y-3">
                                        <div className="text-xs font-bold text-zinc-300 uppercase tracking-wider flex items-center justify-between">
                                            <div className="flex items-center space-x-1.5">
                                                <svg className="w-3.5 h-3.5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                                                <span>Session & Match Notes Tray</span>
                                            </div>
                                            <span className="text-[10px] text-zinc-500 font-normal">
                                                {selectedPlayer.notes ? selectedPlayer.notes.length : 0} entry(ies)
                                            </span>
                                        </div>

                                        <form onSubmit={handleAddNote} className="flex space-x-2">
                                            <input 
                                                type="text"
                                                value={newNoteText}
                                                onChange={(e) => setNewNoteText(e.target.value)}
                                                placeholder="Add encouraging match/training feedback..."
                                                className="flex-1 bg-zinc-900 border border-zinc-700 rounded-lg text-xs px-3 py-2 text-white focus:outline-none focus:border-red-500"
                                            />
                                            <button 
                                                type="submit"
                                                className="bg-zinc-100 hover:bg-white text-zinc-950 font-bold px-3 py-2 rounded-lg text-xs shrink-0 transition"
                                            >
                                                Add Note
                                            </button>
                                        </form>

                                        <div className="space-y-2 pt-1 max-h-52 overflow-y-auto">
                                            {(!selectedPlayer.notes || selectedPlayer.notes.length === 0) ? (
                                                <p className="text-xs text-zinc-500 italic text-center py-2">No notes added to tray yet.</p>
                                            ) : (
                                                selectedPlayer.notes.map(note => (
                                                    <div key={note.id} className="bg-zinc-900 p-2.5 rounded-xl border border-zinc-800 text-xs space-y-1.5">
                                                        <div className="flex justify-between items-center text-[10px]">
                                                            <span className="font-semibold text-zinc-400 flex items-center space-x-1">
                                                                <svg className="w-3 h-3 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                                                <span>{note.date}</span>
                                                            </span>
                                                            
                                                            <div className="flex items-center space-x-2">
                                                                {editingNoteId !== note.id && (
                                                                    <>
                                                                        <button 
                                                                            onClick={() => handleStartEditNote(note)}
                                                                            className="text-zinc-400 hover:text-zinc-200 text-[10px] font-medium underline"
                                                                        >
                                                                            Edit
                                                                        </button>
                                                                        <button 
                                                                            onClick={() => handleDeleteNote(note.id)}
                                                                            className="text-red-400 hover:text-red-300 text-[10px] font-medium underline"
                                                                        >
                                                                            Delete
                                                                        </button>
                                                                    </>
                                                                )}
                                                            </div>
                                                        </div>

                                                        {editingNoteId === note.id ? (
                                                            <div className="flex space-x-1.5 pt-1">
                                                                <input 
                                                                    type="text"
                                                                    value={editingNoteText}
                                                                    onChange={(e) => setEditingNoteText(e.target.value)}
                                                                    className="flex-1 bg-zinc-950 border border-emerald-500 rounded px-2 py-1 text-xs text-white focus:outline-none"
                                                                />
                                                                <button 
                                                                    onClick={() => handleSaveEditNote(note.id)}
                                                                    className="bg-emerald-500 text-zinc-950 font-bold px-2 py-1 rounded text-[10px]"
                                                                >
                                                                    Save
                                                                </button>
                                                                <button 
                                                                    onClick={() => setEditingNoteId(null)}
                                                                    className="bg-zinc-800 text-zinc-400 px-2 py-1 rounded text-[10px]"
                                                                >
                                                                    Cancel
                                                                </button>
                                                            </div>
                                                        ) : (
                                                            <p className="text-zinc-200 font-medium leading-relaxed">{note.text}</p>
                                                        )}
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                </div>

                                <div className="p-3 bg-zinc-950 border-t border-zinc-800 flex justify-end shrink-0">
                                    <button 
                                        onClick={() => setSelectedPlayer(null)}
                                        className="w-full bg-emerald-500 hover:bg-emerald-600 font-bold text-zinc-950 py-2.5 rounded-xl text-xs transition shadow-lg tracking-wide uppercase"
                                    >
                                        Done & Close
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
