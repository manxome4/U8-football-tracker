<!-- PWA Web App Manifest (Inline Blob Strategy) -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<script>
  // Dynamically inject web manifest for Chrome PWA install support
  const manifest = {
    name: "U8 Football Tracker",
    short_name: "U8 Tracker",
    start_url: "./index.html",
    display: "standalone",
    background_color: "#18181b",
    theme_color: "#18181b",
    icons: [{
      src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2318181b'/><circle cx='50' cy='50' r='30' fill='%23dc2626'/><text x='50' y='58' font-size='24' font-weight='bold' text-anchor='middle' fill='white'>U8</text></svg>",
      sizes: "512x512",
      type: "image/svg+xml",
      purpose: "any maskable"
    }]
  };
  const stringManifest = JSON.stringify(manifest);
  const blob = new Blob([stringManifest], {type: 'application/json'});
  const manifestURL = URL.createObjectURL(blob);
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = manifestURL;
  document.head.appendChild(link);
</script>
